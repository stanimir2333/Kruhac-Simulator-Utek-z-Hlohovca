<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>webgl test</title>
<style>html,body{margin:0;background:#204060}canvas{display:block}</style></head>
<body><canvas id="c" width="400" height="300"></canvas>
<script>
const gl = document.getElementById('c').getContext('webgl2', { preserveDrawingBuffer: true, antialias: true });
function draw(t) {
  gl.clearColor(0.9, 0.35, 0.1, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.SCISSOR_TEST); gl.scissor(50 + 100 * Math.sin(t / 300), 50, 120, 90);
  gl.clearColor(0.1, 0.8, 0.3, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.disable(gl.SCISSOR_TEST);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></body></html>
